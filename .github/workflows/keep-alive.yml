# Tarea 1: mantiene despierta la base de datos de Supabase.
# El plan gratis de Supabase pausa el proyecto si pasa 7 días sin uso;
# esta tarea hace una consulta pequeña cada 2 días para que nunca llegue a 7.
name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 */2 * *"   # cada 2 días, 7am Panamá
  workflow_dispatch:          # botón para probarla a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          # Consulta la tabla keep_alive con la URL y la llave guardadas en Secrets
          curl -sf --retry 3 --max-time 30 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
