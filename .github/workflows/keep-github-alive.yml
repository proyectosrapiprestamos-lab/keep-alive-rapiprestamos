name: Mantener repo activo

# Hace un commit pequeño una vez al mes para que GitHub
# no apague las tareas programadas por inactividad (regla de 60 días).

on:
  schedule:
    - cron: "0 13 1 * *"   # día 1 de cada mes, 8am Panamá
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Registrar actividad
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .github/ultima-actividad.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima-actividad.txt
          git commit -m "Mantener repo activo [skip ci]" || echo "Sin cambios"
          git push
